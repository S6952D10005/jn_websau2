<!doctype html>
<html lang="en">
  <!-- Head Section -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boonwarut Protfolio 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- โหลด Font จาก Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Chakra+Petch:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- CSS แบบ Internal Style -->
    <style>
      body {
        background-color: #050505; /* พื้นหลังสีดำ */
        margin: 0;
        padding: 0;
        color: #ffffff;
        font-family:
          "Chakra Petch", sans-serif; /* ใช้ Font Chakra Petch สำหรับข้อความหลัก */
      }

      a {
        color: #ffffff;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      a:hover {
        color: #01d5a2; /* สีเขียวมิ้นต์เมื่อนำเมาส์ไปชี้ */
      }

      /* --------------------------------- */
      /* ส่วนของ Navigation Bar */
      /* --------------------------------- */
      .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 50px 120px;
      }

      .menu {
        display: flex;
        gap: 40px;
        flex: 1;
      }

      .menu a {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .logo {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo h1 {
        font-family: "Caveat", cursive; /* Font ลายมือสำหรับคำว่า hello */
        color: #01d5a2;
        font-size: 4rem;
        margin: 0;
        font-weight: 700;
      }

      .icon {
        display: flex;
        gap: 25px;
        flex: 1;
        justify-content: flex-end;
      }

      .icon a {
        font-size: 1.5rem;
      }

      /* --------------------------------- */
      /* ส่วนของ Profile Info (ข้อความตรงกลาง) */
      /* --------------------------------- */
      .profile-info {
        text-align: center;
        margin-top: 60px;
      }

      .profile-info h1 {
        font-size: 3rem;
        margin: 10px 0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .profile-info h2 {
        font-size: 2rem;
        margin: 10px 0;
        color: #01d5a2;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .profile-info h3 {
        font-size: 2rem;
        margin: 10px 0;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* --------------------------------- */
      /* ส่วนของ Profile Picture (รูปภาพด้านล่าง) */
      /* --------------------------------- */
      .profile-picture {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 50px;
        margin-bottom: 80px;
      }

      /* สร้างกรอบวงกลมสีเขียวด้านนอก */
      .img-container {
        width: 270px;
        height: 270px;
        border-radius: 50%;
        border: 4px solid #01d5a2;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* รูปภาพด้านใน */
      .profile-picture img {
        width: 250px;
        height: 250px;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>

  <!-- Body Section -->
  <body>
    <!-- ส่วนของ nav-bar -->
    <div class="nav-bar">
      <!-- ส่วนของ menu -->
      <div class="menu">
        <a href="#">Portfolio</a>
        <a href="#">About Me</a>
        <a href="#">Get In Touch</a>
      </div>
      <!-- ส่วนของ logo -->
      <div class="logo">
        <!-- ใช้ตัวอักษรแทนภาพเพื่อให้เหมือนตัวอย่าง -->
        <h1>hello</h1>
      </div>
      <!-- ส่วนของ icon -->
      <div class="icon">
        <a href="#"><i class="bi bi-github"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-twitter"></i></a>
        <a href="#"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>

    <!-- ส่วนของ profile-info -->
    <div class="profile-info">
      <h1>Boonwarut Kanyasai</h1>
      <h2>Freelance Web Developer</h2>
      <h3>Based In THAILAND</h3>
    </div>

    <!-- ส่วนของ profile-picture -->
    <div class="profile-picture">
      <div class="img-container">
        <!-- เปลี่ยน src ตรงนี้เป็นที่อยู่รูปภาพของคุณ -->
        <img
          src="https://images.unsplash.com/photo-1542831371-29b0f74f9713?q=80&w=300&h=300&auto=format&fit=crop"
          alt="Profile Picture"
        />
      </div>
    </div>
  </body>
</html>
