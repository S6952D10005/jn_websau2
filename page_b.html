<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boonwarut Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --bg-color: #0d0d0d;
        --nav-bg: #1c1c1c;
        --text-main: #ffffff;
        --text-muted: #888888;
        --btn-color: #4caf50;
        --border-color: #222222;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "IBM Plex Mono", monospace;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Navigation */
      nav {
        background-color: var(--nav-bg);
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 3rem;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
      }

      .nav-container {
        display: flex;
        align-items: center;
        gap: 4rem;
      }

      .nav-links {
        display: flex;
        gap: 3rem;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.3s;
      }

      .nav-links a:hover {
        color: var(--text-main);
      }

      .social-icons {
        display: flex;
        gap: 1.2rem;
      }

      .social-icons a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 1.1rem;
        transition: color 0.3s;
      }

      .social-icons a:hover {
        color: var(--text-main);
      }

      /* Hero Section */
      .hero {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 5rem 10%;
        gap: 6rem;
        flex: 1;
      }

      .hero-content {
        flex: 1;
        max-width: 550px;
      }

      .hero-title {
        font-family: "Raleway", sans-serif;
        font-size: 3.2rem;
        margin: 0 0 1.5rem 0;
        line-height: 1.1;
        letter-spacing: -1px;
        white-space: nowrap;
      }

      .hero-desc {
        color: var(--text-muted);
        line-height: 1.8;
        margin-bottom: 3rem;
        font-size: 0.9rem;
        max-width: 480px;
      }

      .btn {
        background-color: #3b8811;
        color: white;
        border: 2px solid #5db622;
        padding: 1.2rem 3.5rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 1.15rem;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 0 35px rgba(93, 182, 34, 0.25);
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          filter 0.2s;
        display: inline-block;
        text-align: center;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 45px rgba(93, 182, 34, 0.45);
        filter: brightness(1.1);
      }

      .hero-image {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .hero-image img {
        width: 350px;
        height: 350px;
        border-radius: 50%;
        object-fit: cover;
      }

      /* Worked With Section */
      .worked-with {
        padding: 0 10% 4rem;
      }

      .worked-with h3 {
        color: var(--text-main);
        font-size: 0.9rem;
        font-weight: normal;
        margin-bottom: 2rem;
      }

      .logos-box {
        border: 1px solid var(--border-color);
        padding: 2rem 3rem;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #111111;
        flex-wrap: wrap;
        gap: 2rem;
      }

      .logos-box img {
        max-height: 25px;
        filter: grayscale(100%) brightness(1.5) opacity(0.6);
        transition: all 0.3s;
      }

      .logos-box img:hover {
        filter: grayscale(0%) brightness(1) opacity(1);
      }

      /* Responsive */
      @media (max-width: 1024px) {
        .hero {
          flex-direction: column-reverse;
          text-align: center;
          gap: 4rem;
        }
        .hero-image {
          justify-content: center;
        }
        .hero-content {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .hero-title {
          font-size: 3rem;
        }
        .nav-container {
          flex-direction: column;
          gap: 1.5rem;
        }
        .nav-links {
          flex-wrap: wrap;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Case Studies</a></li>
          <li><a href="#">Testimonials</a></li>
          <li><a href="#">Recent work</a></li>
          <li><a href="#">Get In Touch</a></li>
        </ul>
        <div class="social-icons">
          <a href="#"><i class="fab fa-linkedin-in"></i></a>
          <a href="#"><i class="fab fa-behance"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
        </div>
      </div>
    </nav>

    <main class="hero">
      <div class="hero-content">
        <h1 class="hero-title">Boonwarut Kanyasai</h1>
        <p class="hero-desc">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt rem
          odit labore unde nemo omnis sequi hic sit laudantium repellendus
          recusandae vitae ea laborum, ipsa nisi eos autem.
        </p>
        <button class="btn">Let's get started ></button>
      </div>
      <div class="hero-image">
        <img src="images/a2.jpg" alt="Boonwarut Kanyasai" />
      </div>
    </main>

    <section class="worked-with">
      <h3>Worked with</h3>
      <div class="logos-box">
        <img src="images/logo1.png" alt="Partner 1" />
        <img src="images/logo2.png" alt="Partner 2" />
        <img src="images/logo3.png" alt="Partner 3" />
        <img src="images/logo4.png" alt="Partner 4" />
        <img src="images/logo5.png" alt="Partner 5" />
      </div>
    </section>
  </body>
</html>
