<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My Web Design by HTML CSS — ผลงานออกแบบเว็บไซต์ โดย NinniN SAU"
    />
    <title>My Web Design Portfolio</title>

    <!-- favicon แบบ inline กัน 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%239df0ba'/></svg>"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Roboto Mono", monospace;
        background-color: #9df0ba; /* พื้นหลังเขียวมิ้นต์ตามแบบ */
        color: #1a1a1a;
      }

      /* ขนาดตัวอักษรคิดจากสัดส่วนในแบบ (จอ 1440px)
         เขียนไว้ที่นี่แทน class ของ Tailwind เพราะ text-* ของ Tailwind
         จะไปทับค่า line-height ที่เราตั้งเอง */
      .headline {
        font-size: clamp(2.1rem, 3.94vw, 3.6rem); /* = 56.7px ที่จอ 1440 */
        line-height: 1.15;
      }

      .lede {
        font-size: clamp(1.05rem, 1.71vw, 1.55rem); /* = 24.6px ที่จอ 1440 */
        line-height: 1.65;
      }
    </style>
  </head>

  <body class="min-h-screen flex flex-col p-8 md:p-16 lg:p-24">
    <main
      class="flex-1 flex flex-col lg:flex-row lg:items-start gap-14 lg:gap-[5%]"
    >
      <!-- ================= คอลัมน์ซ้าย ================= -->
      <div class="w-full lg:w-[57%] flex flex-col">
        <h1 class="headline font-bold text-[#1f1f1f]">
          My Web Design by<br />
          HTML CSS
        </h1>

        <p class="lede mt-6 text-[#2a2a2a]">
          Lorem ipsum dolor sit amet,<br />
          consectetur adipiscing elit.<br />
          Cursus imperdiet sed id elementum.<br />
          Quam vel aliquam sit vulputate.
        </p>

        <div class="mt-7">
          <a
            href="#"
            class="inline-block bg-[#333333] hover:bg-[#111111] text-white font-medium py-4 md:py-5 px-14 md:px-16 rounded-full text-lg transition-colors"
          >
            Follow Me
          </a>
        </div>

        <!-- รูปแนวนอน 2 ใบ (page_a ซ้าย / page_b ขวา) -->
        <div class="mt-16 md:mt-24 flex flex-col sm:flex-row gap-8 sm:gap-11">
          <a href="page_a.html" class="block sm:w-1/2">
            <img
              src="images/web2.jpg"
              alt="ผลงานหน้า Portfolio ธีมดำ โลโก้ hello"
              class="w-full h-auto"
            />
          </a>
          <a href="page_b.html" class="block sm:w-1/2">
            <img
              src="images/web1.jpg"
              alt="ผลงานหน้า Portfolio ธีมดำ ปุ่มเขียว"
              class="w-full h-auto"
            />
          </a>
        </div>
      </div>

      <!-- ================= คอลัมน์ขวา ================= -->
      <!-- ความกว้างสองใบ 54.84% : 33.16% = อัตราส่วนความกว้างจริงของไฟล์ (258 : 156)
           ทำให้ทั้งคู่สูงเท่ากันพอดีโดยไม่ต้อง crop -->
      <div class="w-full lg:w-[38%] flex items-start gap-[12%]">
        <img
          src="images/web3.png"
          alt="ผลงานหน้าเว็บ Portfolio ธีมน้ำเงิน"
          class="w-[54.84%] h-auto"
        />
        <img
          src="images/web4.png"
          alt="ผลงานหน้าเว็บร้านอาหาร"
          class="w-[33.16%] h-auto"
        />
      </div>
    </main>

    <!-- ================= Footer ================= -->
    <footer
      class="mt-20 text-center text-[#2a2a2a] text-base md:text-lg leading-relaxed"
    >
      <span lang="th">(รูปและเนื้อหาทั้งหมดใช้เพื่อการศึกษาเท่านั้น)</span
      ><br />
      Created by Boonwarut SAU<br />
      Copyright &copy; 2026 SOS SOS SOS
    </footer>
  </body>
</html>
